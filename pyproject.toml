[project]
name = "qenvy"
version = "0.1.0"
description = "A unified Python developer environment layer following XDG Base Directory Specification"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["environment", "config", "xdg", "development", "platformdirs", "developer-tools"]
authors = [
    {name = "Ernest Prabhakar", email = "ernest@quilt.bio"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "platformdirs>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/data-yaml/qenvy"
Repository = "https://github.com/data-yaml/qenvy"
Issues = "https://github.com/data-yaml/qenvy/issues"

[project.scripts]
qenvy = "qenvy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qenvy"]
